[package]
name = "epod"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all", "wav"] }
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
self-replace = "1.5"
ureq = { version = "2.10", features = ["json", "tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
